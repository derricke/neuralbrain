# Stages a release on npm through npm Trusted Publishing (OIDC).
#
# No npm token is stored anywhere. npm trusts this workflow because the package
# is configured on npmjs.com (package Settings → Trusted Publisher → GitHub
# Actions: owner derricke, repository neuralbrain, workflow publish.yml).
#
# The trusted publisher may only STAGE versions ("Allow npm publish" is off).
# A staged version is not public until a maintainer approves it on npmjs.com
# with 2FA, so a compromised workflow or GitHub account cannot publish alone.
# After this workflow succeeds: approve the version on npmjs.com (or run
# `npm stage list neuralbrain` and approve it from there).
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for the OIDC token npm exchanges for a publish credential

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1+, and `npm stage` a newer 11.x.
      - name: Ensure npm supports trusted publishing and staging
        run: npm install -g npm@^11.19.0

      - name: Check release tag matches package.json version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Skip if this version is already on npm
        id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "neuralbrain@$VERSION" version >/dev/null 2>&1; then
            echo "neuralbrain@$VERSION is already published; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.published.outputs.skip != 'true'
        run: npm ci
      - if: steps.published.outputs.skip != 'true'
        run: npm run typecheck
      - if: steps.published.outputs.skip != 'true'
        run: npm test

      # Stages the version; it goes public only after a maintainer approves it.
      - if: steps.published.outputs.skip != 'true'
        run: npm stage publish
