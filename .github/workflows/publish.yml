# Publishes the package to npm through npm Trusted Publishing (OIDC).
#
# No npm token is stored anywhere. npm trusts this workflow because the package
# is configured on npmjs.com (package Settings → Trusted Publisher → GitHub
# Actions: owner derricke, repository neuralbrain, workflow publish.yml).
# Provenance is generated automatically for trusted publishes.
#
# The very first version is published by hand (`npm publish`), since the
# trusted publisher is configured on the package's settings page.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for the OIDC token npm exchanges for a publish credential

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Check release tag matches package.json version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Skip if this version is already on npm
        id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "neuralbrain@$VERSION" version >/dev/null 2>&1; then
            echo "neuralbrain@$VERSION is already published; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.published.outputs.skip != 'true'
        run: npm ci
      - if: steps.published.outputs.skip != 'true'
        run: npm run typecheck
      - if: steps.published.outputs.skip != 'true'
        run: npm test

      - if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
